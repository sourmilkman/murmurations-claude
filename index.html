<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Murmurations — an interactive, ambient study of starlings, locusts, fish, smoke and clouds.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Murmurations</title>
<style>
  :root { --ink: rgba(255,255,255,.88); --dim: rgba(255,255,255,.55); --line: rgba(255,255,255,.14); --glass: rgba(10,12,16,.38); --gold: #cdb07a;
          --serif: "Cormorant Garamond","Cormorant","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
          --sans: ui-sans-serif,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; color: var(--ink); font-family: var(--sans); touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  .bg { position: absolute; left: 0; top: 0; transform-origin: 0 0; opacity: 0; transition: opacity 1.4s ease; will-change: opacity; pointer-events: none; max-width: none; }
  .bg.on { opacity: 1; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .7s ease; }
  #veil { position: fixed; inset: 0; background: #0b0d12; opacity: 1; transition: opacity .9s ease; pointer-events: none; }
  #veil.off { opacity: 0; }
  .ui { transition: opacity .6s ease, transform .6s ease; }
  body.ui-off .ui { opacity: 0; pointer-events: none; }
  body.ui-off #scenes { transform: translate(-50%, 8px); }
  #brand { position: fixed; left: max(20px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top)); pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,.35); }
  #brand .word { font-family: var(--serif); font-size: 22px; letter-spacing: .32em; text-transform: uppercase; font-weight: 500; }
  #brand .ver { font-size: 10px; letter-spacing: .25em; color: var(--dim); margin-top: 4px; text-transform: uppercase; }
  #scenes { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 2px; padding: 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none; }
  #scenes::-webkit-scrollbar { display: none; }
  #scenes button { font-family: var(--serif); font-size: 16px; letter-spacing: .08em; color: var(--dim); background: none; border: 0; padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: color .3s, background .3s; }
  #scenes button:hover { color: var(--ink); }
  #scenes button.on { color: #fff; background: rgba(255,255,255,.1); box-shadow: inset 0 -1px 0 var(--gold); }
  #tools { position: fixed; right: max(14px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); display: flex; gap: 6px; }
  .ib { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .3s, border-color .3s; }
  .ib:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.3); }
  .ib svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .ib.off { color: var(--dim); }
  .ib.off .w { display: none; }
  #panel { position: fixed; right: max(14px, env(safe-area-inset-right)); top: calc(max(12px, env(safe-area-inset-top)) + 52px); width: 270px; padding: 18px 18px 14px; border: 1px solid var(--line); border-radius: 16px; background: rgba(10,12,16,.55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .35s, transform .35s; }
  #panel.open { opacity: 1; transform: none; pointer-events: auto; }
  body.ui-off #panel { opacity: 0; pointer-events: none; }
  #panel h4 { margin: 0 0 12px; font-family: var(--serif); font-weight: 500; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
  .row { margin: 0 0 14px; }
  .row label { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); margin-bottom: 7px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2px; background: rgba(255,255,255,.22); border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(205,176,122,.25); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fff; cursor: pointer; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button { flex: 1; background: none; border: 0; color: var(--dim); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; padding: 7px 0; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: rgba(255,255,255,.14); color: #fff; }
  #bglist { display: flex; flex-direction: column; gap: 4px; }
  #bglist button { text-align: left; background: none; border: 1px solid transparent; color: var(--dim); font-family: var(--serif); font-size: 16px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  #bglist button.on { border-color: var(--line); color: #fff; }
  .hint { font-size: 11px; color: var(--dim); letter-spacing: .04em; line-height: 1.5; margin-top: 4px; }
  #intro { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: radial-gradient(ellipse at center, rgba(11,13,18,.35), rgba(11,13,18,.75)); cursor: pointer; transition: opacity 1.1s ease; z-index: 5; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro .t { font-family: var(--serif); font-size: clamp(34px, 7vw, 72px); letter-spacing: .38em; text-transform: uppercase; font-weight: 400; margin-right: -.38em; }
  #intro .rule { width: 60px; height: 1px; background: var(--gold); margin: 22px auto; opacity: .8; }
  #intro .s { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--dim); }
  #intro .v { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 0; right: 0; font-size: 10px; letter-spacing: .3em; color: rgba(255,255,255,.35); }
  #toast { position: fixed; left: 50%; top: 22px; transform: translate(-50%, -10px); padding: 9px 16px; border-radius: 999px; background: rgba(10,12,16,.6); border: 1px solid var(--line); font-size: 12px; letter-spacing: .1em; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; backdrop-filter: blur(10px); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 560px) { #brand .word { font-size: 16px; } #scenes button { font-size: 14px; padding: 8px 10px; } .ib { width: 36px; height: 36px; } #panel { width: calc(100vw - 28px); } }
</style>
</head>
<body class="ui-off">
<div id="stage">
  <img class="bg" id="bgA" alt="">
  <img class="bg" id="bgB" alt="">
  <canvas id="c"></canvas>
</div>
<div id="veil"></div>

<header id="brand" class="ui"><div class="word">Murmurations</div><div class="ver" id="ver"></div></header>

<div id="tools" class="ui">
  <button class="ib" id="bBg" title="Next background (B)" aria-label="Next background"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="16.5" cy="9" r="1.4"/></svg></button>
  <button class="ib" id="bSound" title="Sound (M)" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path class="w" d="M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11"/></svg></button>
  <button class="ib" id="bShot" title="Save still (S)" aria-label="Save still"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <button class="ib" id="bFull" title="Fullscreen (F)" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="ib" id="bSet" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div>

<section id="panel" class="ui" aria-label="Settings">
  <h4>Atmosphere</h4>
  <div class="row"><label>Environment</label><div id="bglist"></div></div>
  <div class="row"><label>Touch <span id="modeLbl"></span></label><div class="seg" id="mode"><button data-m="scatter">Disturb</button><button data-m="attract">Gather</button></div></div>
  <div class="row"><label>Density <span id="dv"></span></label><input type="range" id="density" min="0.3" max="1.6" step="0.05"></div>
  <div class="row"><label>Tempo <span id="sv"></span></label><input type="range" id="speed" min="0.3" max="1.6" step="0.05"></div>
  <div class="row"><label>Volume <span id="vv"></span></label><input type="range" id="vol" min="0" max="1" step="0.01"></div>
  <div class="hint">Keys: 1–5 scenes · B background · M mute · F fullscreen · H hide UI · S save still</div>
</section>

<nav id="scenes" class="ui"></nav>

<div id="intro"><div><div class="t">Murmurations</div><div class="rule"></div><div class="s">Tap to begin · sound on</div></div><div class="v" id="ver2"></div></div>
<div id="toast"></div>

<script src="js/noise.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/scenes/starlings.js"></script>
<script src="js/scenes/locusts.js"></script>
<script src="js/scenes/fish.js"></script>
<script src="js/scenes/smoke.js"></script>
<script src="js/scenes/clouds.js"></script>
<script src="js/main.js"></script>
</body>
</html>
